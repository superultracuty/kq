<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글날 우리말 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Pretendard", "Noto Sans KR", sans-serif; background: #f5f1e8; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .card { background: #fff; width: 100%; max-width: 560px; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h1 { text-align: center; color: #2c3e50; margin-top: 0; }
  .sub { text-align: center; color: #888; margin-bottom: 20px; }
  button { font-family: inherit; font-size: 16px; cursor: pointer; border: none; border-radius: 10px; padding: 14px; transition: 0.15s; }
  .mode-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 10px 0; background: #2c3e50; color: #fff; }
  .mode-btn:hover { background: #1a252f; }
  .mode-btn .best { font-size: 13px; color: #f5cba7; }
  .sub-btn { width: 100%; margin: 6px 0; background: #eee; color: #333; }
  .sub-btn:hover { background: #ddd; }
  .accent-btn { width: 100%; margin: 6px 0; background: #e67e22; color: #fff; }
  .today { background: linear-gradient(135deg, #fdebd0, #fef9e7); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
  .today .label { font-size: 12px; color: #b9770e; font-weight: bold; }
  .today .word { font-size: 26px; font-weight: bold; color: #2c3e50; margin: 4px 0; }
  .today .mean { color: #555; line-height: 1.5; }
  .progress { color: #888; font-size: 14px; }
  .bar { height: 6px; background: #eee; border-radius: 3px; margin: 8px 0 20px; }
  .bar-fill { height: 100%; background: #e67e22; border-radius: 3px; transition: 0.3s; }
  .tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #fdebd0; color: #b9770e; margin-bottom: 10px; }
  .question { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; }
  .sentence { font-size: 18px; background: #f4f6f7; padding: 12px; border-radius: 8px; margin-top: 8px; font-weight: normal; }
  .option { display: block; width: 100%; margin: 8px 0; text-align: left; background: #f8f9fa; border: 2px solid #e9ecef; color: #333; }
  .option:hover:not(:disabled) { border-color: #e67e22; }
  .option.correct { background: #d4edda; border-color: #28a745; }
  .option.wrong { background: #f8d7da; border-color: #dc3545; }
  .explain { margin-top: 16px; padding: 14px; border-radius: 10px; background: #fef9e7; line-height: 1.6; display: none; }
  .next-btn { width: 100%; margin-top: 16px; background: #e67e22; color: #fff; display: none; }
  .score { font-size: 48px; text-align: center; color: #e67e22; font-weight: bold; }
  .newbest { text-align: center; color: #28a745; font-weight: bold; }
  .inp { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #e9ecef; border-radius: 10px; margin: 6px 0 12px; font-family: inherit; }
  .dict-item { padding: 12px; background: #f8f9fa; border-radius: 10px; margin: 8px 0; line-height: 1.6; }
  .dict-item ol { margin: 6px 0 0; padding-left: 20px; }
  label { font-size: 14px; font-weight: bold; color: #555; }
  .wrong-item { padding: 12px; border-left: 4px solid #dc3545; background: #fdf2f2; margin: 8px 0; border-radius: 6px; line-height: 1.5; }
</style>
</head>

  { type: "순우리말", word: "시나브로", meaning: "모르는 사이에 조금씩 조금씩", q: "'시나브로'의 뜻은?",

  { type: "순우리말", word: "함초롬하다", meaning: "젖거나 서려 있는 모양이 가지런하고 차분하다", q: "'함초롬하다'의 뜻은?",

const QUIZ_LEN = 10;
let quiz = [], idx = 0, score = 0, wrongs = [], mode = "", isRetry = false;
const app = document.getElementById("app");
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// localStorage가 막힌 환경(미리보기 창 등)에서도 멈추지 않도록 안전하게 감싸기
const memStore = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }
};
const getBest = m => { try { return JSON.parse(store.get("best_" + m) || "null"); } catch (e) { return null; } };
function saveBest(m, s, total) {
  const pct = Math.round((s / total) * 100), prev = getBest(m);
  if (!prev || pct > prev.pct) { store.set("best_" + m, JSON.stringify({ pct, s, total })); return true; }
  return false;
}
const bestLabel = m => { const b = getBest(m); return b ? `최고 ${b.s}/${b.total}` : "기록 없음"; };

function todayWord() {
  const words = QUESTIONS.filter(q => q.word), now = new Date();
  const dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  return words[dayNum % words.length];
}

const MODES = [["순우리말", "순우리말 퀴즈"], ["맞춤법", "헷갈리는 맞춤법"], ["문장 고치기", "문장 고치기"],
  ["띄어쓰기", "띄어쓰기"], ["속담·관용구", "속담·관용구"], ["전체", "섞어서 풀기"], ["사전 퀴즈", "사전 퀴즈 (국립국어원)"]];
function showHome() {
  const w = todayWord();
  app.innerHTML = `
    <h1>우리말 퀴즈</h1>
    <p class="sub">한글날 기념, 순우리말과 맞춤법을 알아봐요</p>
    <div class="today"><div class="label">오늘의 순우리말</div><div class="word">${w.word}</div><div class="mean">${w.meaning}</div></div>
    ${MODES.map(([m, label]) => `<button class="mode-btn" onclick="${m === "사전 퀴즈" ? "startDictQuiz()" : `start('${m}')`}"><span>${label}</span><span class="best">${bestLabel(m)}</span></button>`).join("")}
    <button class="sub-btn" onclick="showDict()">표준국어대사전 찾기</button>
    <button class="sub-btn" onclick="showSettings()">API 설정</button>
    <button class="sub-btn" id="resetBtn" onclick="resetBest()">최고 기록 초기화</button>
    <p class="sub" id="toast" style="margin:8px 0 0"></p>`;
}
let resetArmed = false;
function resetBest() {
  // confirm()은 미리보기 창에서 막혀 바로 '취소'가 되므로, 버튼을 두 번 누르는 방식으로 확인해요
  const btn = document.getElementById("resetBtn");
  if (!resetArmed) {
    resetArmed = true;
    if (btn) { btn.textContent = "정말 지울까요? 한 번 더 누르세요"; btn.style.background = "#f8d7da"; }
    setTimeout(() => { resetArmed = false; if (btn && btn.isConnected) { btn.textContent = "최고 기록 초기화"; btn.style.background = ""; } }, 3000);
    return;
  }
  resetArmed = false;
  MODES.forEach(([m]) => store.remove("best_" + m));
  showHome();
  const t = document.getElementById("toast"); if (t) t.textContent = "최고 기록을 모두 지웠어요.";
}

function start(m) { mode = m; isRetry = false; const pool = m === "전체" ? QUESTIONS : QUESTIONS.filter(q => q.type === m); begin(shuffle(pool).slice(0, QUIZ_LEN)); }
function retryWrongs() { isRetry = true; begin(shuffle(wrongs)); }
function begin(list) { quiz = list; idx = 0; score = 0; wrongs = []; showQuestion(); }

function showQuestion() {
  const q = quiz[idx];
  const opts = q.type === "문장 고치기" ? q.options : shuffle(q.options);
  const qText = q.type === "문장 고치기" ? `틀린 부분을 고르세요.<div class="sentence">${q.sentence}</div>` : q.q.replace(/\n/g, "<br>");
  app.innerHTML = `
    <div class="progress">${idx + 1} / ${quiz.length} | 점수 ${score}${isRetry ? " | 오답 다시 풀기" : ""}</div>
    <div class="bar"><div class="bar-fill" style="width:${(idx / quiz.length) * 100}%"></div></div>
    <span class="tag">${q.type}</span>
    <div class="question">${qText}</div>
    <div>${opts.map(o => `<button class="option">${esc(o)}</button>`).join("")}</div>
    <div class="explain" id="explain"></div>
    <button class="next-btn" id="next">${idx + 1 === quiz.length ? "결과 보기" : "다음 문제"}</button>`;
  document.querySelectorAll(".option").forEach(btn => btn.onclick = () => check(btn, q));
  document.getElementById("next").onclick = () => { idx++; idx < quiz.length ? showQuestion() : showResult(); };
}
function check(btn, q) {
  document.querySelectorAll(".option").forEach(b => { b.disabled = true; if (b.textContent === q.answer) b.classList.add("correct"); });
  const ok = btn.textContent === q.answer;
  if (ok) score++; else { btn.classList.add("wrong"); wrongs.push(q); }
  const ex = document.getElementById("explain");
  ex.innerHTML = `<b>${ok ? "정답입니다!" : "아쉬워요."}</b><br>${q.explain}`;
  ex.style.display = "block";
  document.getElementById("next").style.display = "block";
}
function showResult() {
  const pct = Math.round((score / quiz.length) * 100);
  const isNewBest = !isRetry && saveBest(mode, score, quiz.length);
  const msg = pct === 100 ? "완벽해요! 세종대왕님도 흐뭇해하실 거예요." : pct >= 70 ? "훌륭해요! 우리말을 잘 아시네요." : pct >= 40 ? "좋아요! 오답을 한 번 더 풀어 봐요." : "괜찮아요. 오늘 배운 말부터 써 보세요!";
  app.innerHTML = `
    <h1>${isRetry ? "오답 다시 풀기 결과" : "결과"}</h1>
    <div class="score">${score} / ${quiz.length}</div>
    ${isNewBest ? `<p class="newbest">최고 기록을 새로 세웠어요!</p>` : ""}
    <p class="sub">${msg}</p>
    ${wrongs.length ? `<button class="accent-btn" onclick="retryWrongs()">틀린 ${wrongs.length}문제 다시 풀기</button><h3>오답 노트</h3>
      ${wrongs.map(w => `<div class="wrong-item"><b>${w.sentence || w.q.replace(/\n/g, " ")}</b><br>정답: ${w.answer}<br><small>${w.explain}</small></div>`).join("")}` : ""}
    <button class="mode-btn" style="justify-content:center" onclick="showHome()">처음으로</button>`;
}

// ===================== 국립국어원 표준국어대사전 API =====================
// 인증 키 발급: https://stdict.korean.go.kr/openapi/openApiInfo.do
const API_URL = "https://stdict.korean.go.kr/api/search.do";
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const getKey = () => store.get("stdict_key") || "";
const getProxy = () => store.get("stdict_proxy") || "";
const START_SYL = "가나다라마바사아자차카타파하고노도로모보소오조초코토포호구누두루무부수우주추쿠투푸후기니디리미비시이지치키티피히개내대매배새재해거너더러머버서어저처커터퍼허그느드르므브스으즈츠크트프흐";

async function stdictSearch(params) {
  const key = getKey();
  if (!key) throw new Error("NO_KEY");
  const qs = new URLSearchParams({ key, req_type: "json", ...params });
  let url = API_URL + "?" + qs;
  const proxy = getProxy();
  if (proxy) url = proxy.includes("{url}") ? proxy.replace("{url}", encodeURIComponent(url)) : proxy + encodeURIComponent(url);
  let res;
  try { res = await fetch(url); } catch (e) { throw new Error("NETWORK"); }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data) {
    if (text.trim() === "" || text.trim() === "{}") return [];
    throw new Error("BAD_RESPONSE");
  }
  if (data.error) throw new Error("API_" + (data.error.error_code || "") + " " + (data.error.message || ""));
  const items = data.channel && data.channel.item ? data.channel.item : [];
  return (Array.isArray(items) ? items : [items]).map(it => {
    const senses = Array.isArray(it.sense) ? it.sense : (it.sense ? [it.sense] : []);
    return { word: it.word, sup: it.sup_no, pos: it.pos,
      defs: senses.map(s => ({ def: s.definition, link: s.link, type: s.type })) };
  });
}

function apiErrorMsg(e) {
  const m = e.message || "";
  if (m === "NO_KEY") return "먼저 'API 설정'에서 인증 키를 넣어 주세요.";
  if (m === "NETWORK") return "사전 서버에 연결하지 못했어요. 브라우저 보안 정책(CORS) 때문일 수 있어요. 'API 설정'에서 프록시 주소를 넣어 보세요.";
  if (m.startsWith("API_020")) return "등록되지 않은 인증 키예요. 키를 다시 확인해 주세요.";
  if (m.startsWith("API_021")) return "인증 키가 일시적으로 사용 중지됐어요.";
  if (m.startsWith("API_")) return "사전 API 오류: " + m.slice(4);
  return "알 수 없는 응답이 왔어요: " + m;
}
const cleanDef = d => String(d || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();

// ----- 설정 화면 -----
function showSettings() {
  app.innerHTML = `
    <h1>API 설정</h1>
    <p class="sub" style="text-align:left;line-height:1.6">
      표준국어대사전 오픈 API 인증 키를 넣으면 <b>사전 찾기</b>와 <b>사전 퀴즈</b>를 쓸 수 있어요.<br>
      키 발급: <a href="https://stdict.korean.go.kr/openapi/openApiInfo.do" target="_blank">stdict.korean.go.kr 오픈 API</a> (회원 가입 후 무료 신청)
    </p>
    <label>인증 키 (32자리)</label>
    <input id="keyIn" class="inp" value="${esc(getKey())}" placeholder="예: 1A2B3C...">
    <label>프록시 주소 (선택)</label>
    <input id="proxyIn" class="inp" value="${esc(getProxy())}" placeholder="예: https://내-워커.workers.dev/?url=">
    <p class="sub" style="text-align:left;font-size:13px">브라우저에서 바로 호출이 막히면(CORS) 프록시가 필요해요. 주소 끝에 원래 요청 주소가 붙어요. {url}을 넣으면 그 자리에 들어가요.</p>
    <button class="accent-btn" onclick="saveSettings()">저장</button>
    <button class="sub-btn" onclick="testApi()">연결 테스트</button>
    <p id="msg" class="sub"></p>
    <button class="mode-btn" style="justify-content:center" onclick="showHome()">처음으로</button>`;
}
function saveSettings() {
  store.set("stdict_key", document.getElementById("keyIn").value.trim());
  store.set("stdict_proxy", document.getElementById("proxyIn").value.trim());
  document.getElementById("msg").textContent = "저장했어요.";
}
async function testApi() {
  saveSettings();
  const msg = document.getElementById("msg");
  msg.textContent = "확인 중...";
  try {
    const r = await stdictSearch({ q: "한글" });
    msg.textContent = r.length ? `연결 성공! '한글' 뜻: ${cleanDef(r[0].defs[0] && r[0].defs[0].def).slice(0, 40)}...` : "연결은 됐는데 결과가 없어요.";
  } catch (e) { msg.textContent = apiErrorMsg(e); }
}

// ----- 사전 찾기 화면 -----
function showDict(prefill = "") {
  app.innerHTML = `
    <h1>표준국어대사전 찾기</h1>
    <div style="display:flex;gap:8px">
      <input id="dictIn" class="inp" style="margin:0" placeholder="단어를 입력하세요" value="${esc(prefill)}">
      <button class="accent-btn" style="width:auto;margin:0" onclick="doDict()">찾기</button>
    </div>
    <div id="dictOut" style="margin-top:16px"></div>
    <button class="mode-btn" style="justify-content:center" onclick="showHome()">처음으로</button>`;
  const inp = document.getElementById("dictIn");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doDict(); });
  if (prefill) doDict();
}
async function doDict() {
  const q = document.getElementById("dictIn").value.trim();
  const out = document.getElementById("dictOut");
  if (!q) return;
  out.innerHTML = `<p class="sub">찾는 중...</p>`;
  try {
    const items = await stdictSearch({ q, num: 20 });
    if (!items.length) { out.innerHTML = `<p class="sub">'${esc(q)}'(으)로 찾은 결과가 없어요.</p>`; return; }
    out.innerHTML = items.map(it => `
      <div class="dict-item">
        <b style="font-size:18px">${esc(it.word)}</b>${it.sup && it.sup !== "0" ? `<sup>${esc(it.sup)}</sup>` : ""}
        <span class="tag" style="margin-left:6px">${esc(it.pos || "품사 없음")}</span>
        <ol>${it.defs.map(d => `<li>${esc(cleanDef(d.def))}${d.link ? ` <a href="${esc(d.link)}" target="_blank">[사전]</a>` : ""}</li>`).join("")}</ol>
      </div>`).join("");
  } catch (e) { out.innerHTML = `<p class="sub">${esc(apiErrorMsg(e))}</p>`; }
}

// ----- 사전 퀴즈: 고유어(순우리말) 명사를 무작위로 받아 뜻 맞히기 -----
async function fetchNativeWords() {
  const syl = START_SYL[Math.floor(Math.random() * START_SYL.length)];
  const items = await stdictSearch({ q: syl, advanced: "y", method: "start", type1: "word", type2: "native",
    pos: "1", letter_s: "2", letter_e: "4", num: "100" });
  const seen = new Set();
  return items.map(it => ({ word: String(it.word || "").replace(/[-^]/g, ""), def: cleanDef(it.defs[0] && it.defs[0].def) }))
    .filter(x => x.word && x.def && x.def.length < 70 && !x.def.startsWith("→") && !x.def.includes("의 잘못") && !x.def.includes("의 방언")
      && !x.def.includes("의 옛말") && !x.def.includes("의 준말") && !seen.has(x.word) && seen.add(x.word));
}
async function startDictQuiz() {
  app.innerHTML = `<h1>사전 퀴즈</h1><p class="sub">표준국어대사전에서 순우리말을 가져오는 중...</p>`;
  try {
    let pool = [];
    for (let tries = 0; tries < 8 && pool.length < 40; tries++) pool = pool.concat(await fetchNativeWords());
    const uniq = []; const seen = new Set();
    pool.forEach(p => { if (!seen.has(p.word)) { seen.add(p.word); uniq.push(p); } });
    if (uniq.length < 4) throw new Error("FEW");
    const picked = shuffle(uniq).slice(0, Math.min(QUIZ_LEN, uniq.length));
    const qs = picked.map(p => {
      const wrong = shuffle(uniq.filter(u => u.word !== p.word)).slice(0, 3).map(u => u.def);
      return { type: "사전 퀴즈", q: `'${p.word}'의 뜻은?`, options: [p.def, ...wrong], answer: p.def,
        explain: `${p.word}: ${p.def} <a href="#" onclick="showDict('${esc(p.word)}');return false;">[사전에서 보기]</a>` };
    });
    mode = "사전 퀴즈"; isRetry = false; begin(qs);
  } catch (e) {
    const msg = e.message === "FEW" ? "가져온 단어가 너무 적어요. 다시 시도해 주세요." : apiErrorMsg(e);
    app.innerHTML = `<h1>사전 퀴즈</h1><p class="sub">${esc(msg)}</p>
      <button class="accent-btn" onclick="showSettings()">API 설정</button>
      <button class="mode-btn" style="justify-content:center" onclick="showHome()">처음으로</button>`;
  }
}

showHome();
